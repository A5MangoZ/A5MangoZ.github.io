<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="3; url=/" />
    <title>Page Not Found | Angga Prawira Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #0d1117;
        color: #e6edf3;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 40px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 16px 32px rgba(0,0,0,0.4);
      }
      .code {
        font-size: 72px;
        font-weight: 800;
        color: #2E7D52;
        line-height: 1;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      p {
        font-size: 14px;
        color: #8b949e;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        background: #2E7D52;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        transition: background 0.2s ease;
      }
      .btn:hover {
        background: #246542;
      }
      .timer {
        margin-top: 16px;
        font-size: 12px;
        color: #6e7681;
      }
    </style>
    <script>
      let seconds = 3;
      const interval = setInterval(function() {
        seconds--;
        const el = document.getElementById('count');
        if (el) el.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.replace('/');
        }
      }, 1000);
    </script>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for doesn't exist or has moved. Redirecting you to the portfolio homepage...</p>
      <a href="/" class="btn">Return to Homepage</a>
      <div class="timer">Redirecting in <span id="count">3</span> seconds...</div>
    </div>
  </body>
</html>
